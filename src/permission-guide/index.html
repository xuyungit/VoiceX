<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceX</title>
  <link rel="stylesheet" href="./guide.css">
</head>

<body>
  <main class="guide" hidden>
    <div class="drag-column">
      <svg class="arrow" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z" />
      </svg>
      <button class="drag-tile" id="dragTile" type="button">
        <img id="appIcon" alt="" draggable="false">
      </button>
      <span class="drag-label" id="dragLabel"></span>
    </div>
    <div class="text-column">
      <h1 id="title"></h1>
      <p id="hint"></p>
      <p id="note" class="note" hidden></p>
    </div>
    <button class="close" id="closeButton" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
      </svg>
    </button>
  </main>
  <script type="module" src="./guide.ts"></script>
</body>

</html>
