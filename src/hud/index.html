<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceX HUD</title>
  <link rel="stylesheet" href="./hud.css">
</head>

<body class="hud-loading">
  <div id="hud">
    <!-- One row, left to right: state icon or mini waveform, waveform, text,
         countdown, chip.
         Each presentation shows the parts it needs (hud.css). -->
    <div class="hud-capsule" id="hudCapsule">
      <div class="status-icon" id="statusIcon">
        <!-- Mic icon (Push-to-Talk) -->
        <svg class="icon icon-mic" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z" />
          <path
            d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
        </svg>
        <!-- Waveform icon (Hands-Free) -->
        <svg class="icon icon-waveform" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M3 9v6h4l5 5V4L7 9H3zm7-.17v6.34L7.83 13H5v-2h2.83L10 8.83zM16.5 12A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
        </svg>
        <!-- Cloud icon (Batch ASR recognizing) -->
        <svg class="icon icon-cloud" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h.71C7.37 7.69 9.48 6 12 6a5.5 5.5 0 0 1 5.3 4.02l.3 1.01 1.05.07c1.52.1 2.85 1.35 2.85 2.9 0 1.65-1.35 3-3 3z"/>
        </svg>
        <!-- Selected-text reading: Material Symbols `text_to_speech`, taken
             from the icon set unmodified. A page with sound coming off it —
             reading aloud and dictating point in opposite directions and
             should not share the microphone.
             Its viewBox is the Material Symbols 960 grid rather than the
             24-unit one the icons above use. That is deliberate: the path is
             authored for it, and rescaling by hand is how an icon ends up
             looking hand-drawn. `.status-icon .icon` sizes by viewBox, so it
             lands at the same size as the rest. -->
        <svg class="icon icon-speaking" viewBox="0 -960 960 960" fill="currentColor">
          <path
            d="M140-80q-24.75 0-42.37-17.63Q80-115.25 80-140v-680q0-24.75 17.63-42.38Q115.25-880 140-880h346l-60 60H140v680h480v-110h60v110q0 24.75-17.62 42.37Q644.75-80 620-80H140Zm100-170v-60h280v60H240Zm0-120v-60h200v60H240Zm380 10L460-520H320v-200h140l160-160v520Zm60-92v-346q56 21 88 74t32 104q0 51-35 101t-85 67Zm0 142v-62q70-25 125-90t55-158q0-93-55-158t-125-90v-62q102 27 171 112.5T920-620q0 112-69 197.5T680-310Z" />
        </svg>
        <!-- Wand icon (AI Correction) -->
        <svg class="icon icon-wand" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M7.5 5.6L10 7 8.6 4.5 10 2 7.5 3.4 5 2l1.4 2.5L5 7l2.5-1.4zm12 9.8L17 14l1.4 2.5L17 19l2.5-1.4L22 19l-1.4-2.5L22 14l-2.5 1.4zM22 2l-2.5 1.4L17 2l1.4 2.5L17 7l2.5-1.4L22 7l-1.4-2.5L22 2zM9.37 17.03L7.03 14.69l8.48-8.48 2.34 2.34-8.48 8.48zm-.7 1.4l2.34-2.34 2.34 2.34-2.34 2.34-2.34-2.34z" />
        </svg>
        <!-- Check (the text was typed) -->
        <svg class="icon icon-check" viewBox="0 0 24 24">
          <path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <!-- Alert (error) -->
        <svg class="icon icon-alert" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M12 7v6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="12" cy="16.8" r="1.3" fill="currentColor" />
        </svg>
      </div>
      <!-- Stream dictation's live level, in place of the state icon. -->
      <div class="mini-wave" id="miniWave" aria-hidden="true"></div>
      <div class="waveform-bars" id="waveformBars" aria-hidden="true"></div>
      <canvas class="waveform-hybrid" id="waveformHybridCanvas" aria-hidden="true"></canvas>
      <div class="text-area" id="textArea"></div>
      <div class="countdown" id="countdown"></div>
      <div class="intent-chip" id="intentChip"></div>
    </div>
  </div>
  <script type="module" src="./hud.ts"></script>
</body>

</html>
