# LLM Benchmark Test Cases
# Copy to test_cases.toml and customize
#
# A case is what the recognizer heard (`input`) and the text the app prompt
# should make of it (`expected`): recognition errors fixed, and the fillers,
# stutters and abandoned half-sentences gone, as the prompt asks. The places to
# correct are derived from the difference between the two; a fix whose intended
# word is in the config dictionary counts as `dictionary`, any other changed
# word as `semantic`, and words that only go away as `cleanup`. There is nothing
# else to write per case.
#
# Cleanup sites are settled by code alone (gone, kept, or partly gone) and go
# into the clean dimension: an output that keeps every filler keeps half of its
# clean credit. So write `expected` without them: a filler you leave in is one
# you want kept, and a model that deletes it is judged like any other edit.
#
# Optional [[case.pin]]: your own verdict on an answer that is neither the
# expected one nor the uncorrected error. Whoever wrote `written` where `heard`
# stood gets `credit` (0..1); the judge is not asked about it again.

[[case]]
name = "Simple typo"
input = "今天天汽很好，我们去公园万吧"
expected = "今天天气很好，我们去公园玩吧"

[[case]]
name = "Technical terms"
input = "我们用的是库伯内提斯来部署容器"
expected = "我们用的是 Kubernetes 来部署容器"

[[case]]
name = "Homophone errors"
input = "这个项目的进度已经严重之后了，我们需要加快速度"
expected = "这个项目的进度已经严重滞后了，我们需要加快速度"

[[case]]
name = "Mixed Chinese-English"
input = "请把这个docker镜像推送到仓库里面"
expected = "请把这个 Docker 镜像推送到仓库里面"

[[case]]
name = "Context-sensitive terms"
input = "应该会记录一些我们正在进行的事情，但是不要记录细节，而是指向下一集的导航，比如说我们这次发现了哪些信息、哪些报告、哪些结论，在查看哪个目录。这是一个 high level 的项目介绍，以及一些关键的功能以及关键的导航。然后我们的 cloud md 里边就去指向 read me。然后把一些过时的文档做一下清理。"
expected = "应该会记录一些我们正在进行的事情，但是不要记录细节，而是指向下一级的导航，比如说我们这次发现了哪些信息、哪些报告、哪些结论，在查看哪个目录。这是一个 high level 的项目介绍，以及一些关键的功能以及关键的导航。然后我们的 CLAUDE.md 里边就去指向 README。然后把一些过时的文档做一下清理。"

# [[case.pin]]
# heard = "下一集"
# written = "下一层"
# credit = 1.0

# Real dictation. 制作 → 支座 is a dictionary site when 支座 is in the
# dictionary (three times); 拖 tip → tooltip is semantic (twice); the 嗯/呃/啊,
# the stutters (这这个, 可以可以, 选选中, 本本质上) and the half word in 页HTML
# are cleanup sites.

[[case]]
name = "Bearing reactions"
input = "嗯，把这这个数据稍微处理一下，然后可视化。我其实是想得到一个可交互的一个呃数据展示页面。这里边的每个这个呃支座，嗯反力，呃横坐标是这个时间，纵坐标是制作反力的测量值。啊，我希望这个嗯通过一个页HTML页面来实现。然后呃通过一个时序图，这个时序图可以交互。啊，比如说我想选中其中的一块，那就可以去呃去去去呃图放大只显示这一块。呃，然后十二个制作的这个图可以显示在一个图上，下边可以可以选选中或者取消选中某个制作。本本质上我们是要用它来观察数据，然后呃这个看看这个数据在某些时候的变化。所以这个每个图上也要有拖 tip，拖 tip 上有名字以及当前的这个值是多少。听明白了吗？"
expected = "把这个数据稍微处理一下，然后可视化。我其实是想得到一个可交互的数据展示页面。这里边的每个支座反力，横坐标是时间，纵坐标是支座反力的测量值。我希望通过一个 HTML 页面来实现。然后通过一个时序图，这个时序图可以交互。比如说我想选中其中的一块，那就可以去图放大只显示这一块。然后十二个支座的图可以显示在一个图上，下边可以选中或者取消选中某个支座。本质上我们是要用它来观察数据，然后看看这个数据在某些时候的变化。所以每个图上也要有tooltip，tooltip 上有名字以及当前的值是多少。听明白了吗？"

# Same rule. Abacus → Abaqus four times, 麦达斯 → Midas once. Neither term is
# in the example dictionary, so those five sites are semantic; the 嗯/呃 and the
# 就是 / 这个 said while thinking are cleanup sites.

[[case]]
name = "Abaqus and Midas"
input = "我们需要综合考虑我们的这个 Abacus 的模型，以及我们当前这个项目的，嗯，遇到的问题，呃，和挑战。要考虑就是到底我们遇到的问题是不是用 Abacus 模型能得到更好的结果，或者是，嗯，就是 Abacus 模型能更加去，呃，建模石桥的这个行为。所以我们现在要决策，呃，是不是要把之前基于跟麦达斯对齐的一个内部实现的有限元，然后如何换成 Abacus 这样的一个实现，我们可以讨论一下。"
expected = "我们需要综合考虑我们的 Abaqus 的模型，以及我们当前这个项目遇到的问题和挑战。要考虑就是到底我们遇到的问题是不是用 Abaqus 模型能得到更好的结果，或者是 Abaqus 模型能更加去建模石桥的行为。所以我们现在要决策，是不是要把之前基于跟Midas对齐的一个内部实现的有限元，然后如何换成 Abaqus 这样的一个实现，我们可以讨论一下。"
