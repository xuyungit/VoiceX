# LLM Benchmark Configuration
# Copy to config.toml and fill in your API keys

# Global settings
rounds = 3  # Number of rounds per provider per test case

# System prompt template for text correction
# {{DICTIONARY}} will be replaced with the dictionary content
prompt = """你是一个语音转写文本纠正助手。

你的任务：
- 修正语音识别文本中的识别错误、同音字错误、错别字和标点问题
- 保持原意，不增删信息
- 当识别结果中出现与用户词典中词汇发音相似的词时，替换为词典中的标准形式

用户热词词典：
{{DICTIONARY}}

输出：
纠正后的文本或原文（如果不需要任何修改），不要输出任何其他说明性的内容"""

# Dictionary words (one per line)
dictionary = """
Kubernetes
Docker
VoiceX
Claude
"""

# Optional second-pass evaluator. After all providers finish, this model
# scores free-form rewrite quality (one ranking dimension; not the whole score).
# Keep [judge] / [eval] below prompt and dictionary — a TOML table owns
# every following key until the next table header.
# [judge]
# name = "Quality-Judge"
# base_url = "https://api.openai.com/v1"
# api_key = "${OPENAI_API_KEY}"
# model = "gpt-4o"
# type = "openai"

# [eval]
# Five dimensions, different priorities. Missing dimensions (no checkpoints of
# that tier, or no judge) are dropped and the rest renormalized.
# weight_basic = 0.20      # dictionary / simple name fixes
# weight_latency = 0.30    # voice-correction SLA; not min-max across the field
# weight_cloud = 0.20      # cloud → Claude
# weight_bonus = 0.10      # icing: README, 下一集→下一级, ...
# weight_quality = 0.20    # judge free-form rewrite quality
# weight_success = 0.0     # API failures already zero latency + checkpoints
# latency_full_ms = 1000   # avg ≤ this scores 1.0
# latency_zero_ms = 5000   # avg ≥ this scores 0.0
# standing_scheme = "borda"  # or "f1" (25/18/15/... for top 10)
# standing_decay = 0.9       # older races fade; 1.0 = no decay
# standing_window = 10       # only last N races feed form; 0 = all history
# standing_retire_after = 3  # hide models absent this many races in a row; 0 = never

# --- Providers ---
# Each [[provider]] is one model to benchmark.
# api_key supports ${ENV_VAR} syntax for environment variables.
# type: "volcengine" | "openai" | "custom"
# [provider.extra] can inject arbitrary fields into the request body.

[[provider]]
name = "Doubao-Seed-Lite"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "${VOLCENGINE_API_KEY}"
model = "doubao-seed-1-6-lite-251015"
type = "volcengine"
reasoning_effort = "minimal"

[[provider]]
name = "Doubao-Seed-Pro"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "${VOLCENGINE_API_KEY}"
model = "doubao-seed-1-6-pro-251015"
type = "volcengine"
reasoning_effort = "minimal"

[[provider]]
name = "GPT-4o-mini"
base_url = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"
model = "gpt-4o-mini"
type = "openai"

[[provider]]
name = "Qwen3.5-Plus"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "${DASHSCOPE_API_KEY}"
model = "qwen3.5-plus"
type = "custom"
[provider.extra]
enable_thinking = false

