# LLM Benchmark Configuration
# Copy to config.toml and fill in your API keys

# Global settings
rounds = 3  # Number of rounds per provider per test case

# System prompt template for text correction
# {{DICTIONARY}} will be replaced with the dictionary content
prompt = """你是一个语音转写文本纠正助手。

你的任务：
- 修正语音识别文本中的识别错误、同音字错误、错别字和标点问题
- 保持原意，不增删信息
- 当识别结果中出现与用户词典中词汇发音相似的词时，替换为词典中的标准形式

用户热词词典：
{{DICTIONARY}}

输出：
纠正后的文本或原文（如果不需要任何修改），不要输出任何其他说明性的内容"""

# Dictionary words (one per line)
dictionary = """
Kubernetes
Docker
VoiceX
Claude
"""

# --- Scoring ---
# A test case is `input` (what the recognizer heard) and `expected` (what was
# said). The places to correct are the differences between the two, and each
# one is scored where it stands in the model's output:
#
#   dictionary  the intended word is in the dictionary above. Passes when that
#               term stands there, in any casing or with a suffix (Claude,
#               CLAUDE.md, Claude md). Settled by code.
#   semantic    any other fix (下一集 → 下一级). Code settles the exact answer
#               and the untouched error; anything else goes to the judge.
#   clean       the model changed nothing else. Spacing, sentence punctuation
#               and casing cost nothing; other changes go to the judge.
#
# The judge is only asked what code cannot settle, each distinct question once,
# after all timing is done. Without a [judge], or with --skip-judge, those
# verdicts are listed as unjudged and left out of the rates — never counted as
# misses. Low-confidence verdicts are listed for review; settle one for good
# with a [[case.pin]] in test_cases.toml.
#
# Keep [judge] / [eval] below prompt and dictionary — a TOML table owns
# every following key until the next table header.
# api_key accepts a literal, ${ENV_VAR}, or file:<path>.
# [judge]
# name = "TypeSafe-Judge"
# base_url = "https://api.typesafe.ai/v1/systemone"   # https://docs.typesafe.ai
# api_key = "file:.jev_key"
# model = "jev-1.13.0"     # pin a version: `jev-latest` changes verdicts between runs
# type = "typesafe"

# [eval]
# Composite = weighted mean over the dimensions a model has a rate for.
# weight_dictionary = 0.40  # homophones fixed from the dictionary
# weight_latency = 0.35     # voice-correction SLA; absolute, not min-max across the field
# weight_semantic = 0.15    # fixes that need the context
# weight_clean = 0.10       # nothing changed beyond the fixes
# weight_success = 0.0      # a failed call already scores zero everywhere
# latency_full_ms = 1000    # avg ≤ this scores 1.0
# latency_zero_ms = 5000    # avg ≥ this scores 0.0
# typesafe_questions = "typesafe_questions.json"   # override the built-in judge questions
# typesafe_concurrency = 8   # parallel judge calls
# standing_scheme = "borda"  # or "f1" (25/18/15/... for top 10)
# standing_decay = 0.9       # older races fade; 1.0 = no decay
# standing_window = 10       # only last N races feed form; 0 = all history
# standing_retire_after = 3  # hide models absent this many races in a row; 0 = never
# Older names still work: weight_basic + weight_cloud (summed) = weight_dictionary,
# weight_bonus = weight_semantic, weight_quality = weight_clean.

# --- Providers ---
# Each [[provider]] is one model to benchmark.
# api_key supports ${ENV_VAR} syntax for environment variables.
# type: "volcengine" | "openai" | "qwen" | "gemini" | "custom"
# [provider.extra] can inject arbitrary fields into the request body.
#
# Correction / translation should use the lowest thinking the model accepts.
#   volcengine: reasoning_effort defaults to "minimal" if omitted
#   openai / custom: set reasoning_effort when the model reasons
#     (Cerebras: "none", OpenAI GPT-5: "minimal", DeepSeek: "none")
#   qwen: enable_thinking is forced off unless extra overrides it
#   gemini: code sends the lowest thinkingLevel / thinkingBudget the model accepts
#   extra: vendor knobs, e.g. enable_thinking = false, thinking = { type = "disabled" }

[[provider]]
name = "Doubao-Seed-Lite"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "${VOLCENGINE_API_KEY}"
model = "doubao-seed-1-6-lite-251015"
type = "volcengine"
reasoning_effort = "minimal"

[[provider]]
name = "Doubao-Seed-Pro"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
api_key = "${VOLCENGINE_API_KEY}"
model = "doubao-seed-1-6-pro-251015"
type = "volcengine"
reasoning_effort = "minimal"

# gpt-4o-mini is not a reasoning model; do not send reasoning_effort.
[[provider]]
name = "GPT-4o-mini"
base_url = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"
model = "gpt-4o-mini"
type = "openai"

